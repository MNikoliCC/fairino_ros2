name: fairino-simmachine

services:
  simmachine:
    image: ${SIMMACHINE_IMAGE:?Run ./simmachine.sh up first}
    container_name: fairino-simmachine-v${SIMMACHINE_VERSION}
    privileged: true
    user: root
    restart: unless-stopped
    networks:
      fairino-net:
        ipv4_address: ${SIMMACHINE_IP:-192.168.58.2}

  ros2:
    image: fairino-ros2:${FAIRINO_ROS_DISTRO:-humble}
    build:
      context: .
      dockerfile: Dockerfile.ros2
      args:
        ROS_DISTRO: ${FAIRINO_ROS_DISTRO:-humble}
        ROS_UID: ${HOST_UID:-1000}
        ROS_GID: ${HOST_GID:-1000}
        ROBOPLAN_VERSION: ${ROBOPLAN_VERSION:-ac29aa9}
    container_name: fairino-ros2-${FAIRINO_ROS_DISTRO:-humble}
    depends_on:
      - simmachine
    init: true
    ipc: host
    # Real-time scheduling for the 1 kHz controller manager and servo loops.
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    environment:
      DISPLAY: ${DISPLAY}
      # Dedicated DDS domain: with ipc: host, other ROS 2 systems on the same
      # host are otherwise discovered through shared memory on domain 0 and
      # can publish into this stack (for example a foreign /joint_states).
      ROS_DOMAIN_ID: ${FAIRINO_ROS_DOMAIN_ID:-42}
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_X11_NO_MITSHM: "1"
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ../fairino20_v6_moveit2_config:/ros2_ws/src/fairino20_v6_moveit2_config:ro
      - ../fairino_description:/ros2_ws/src/fairino_description:ro
      - ../fairino_hardware:/ros2_ws/src/fairino_hardware:ro
      - ../fairino_hardware_v3_9_9:/ros2_ws/src/fairino_hardware_v3_9_9:ro
      - ../fairino_msgs:/ros2_ws/src/fairino_msgs:ro
      - ../roboplan-ros:/ros2_ws/src/roboplan_ros:ro
      - ../fairinoplan_bringup:/ros2_ws/src/fairinoplan_bringup:ro
      - ../fairino_cartesian_servo:/ros2_ws/src/fairino_cartesian_servo:ro
      - ros2-build:/ros2_ws/build
      - ros2-install:/ros2_ws/install
      - ros2-log:/ros2_ws/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      fairino-net:
        ipv4_address: 192.168.58.3

networks:
  fairino-net:
    name: fairino-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.58.0/24
          gateway: 192.168.58.1

volumes:
  ros2-build:
    name: fairino-ros2-${FAIRINO_ROS_DISTRO:-humble}-build
  ros2-install:
    name: fairino-ros2-${FAIRINO_ROS_DISTRO:-humble}-install
  ros2-log:
    name: fairino-ros2-${FAIRINO_ROS_DISTRO:-humble}-log
